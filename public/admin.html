<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Admin Panel</title>
</head>

<body>

  <h2>Admin Login</h2>

  <!-- Passcode input -->
  <input id="passcode" placeholder="Enter admin passcode">
  <button onclick="adminLogin()">Login</button>

  <!-- Admin panel (hidden until login) -->
  <div id="adminPanel" style="display:none; margin-top:20px;">

    <h2>Manage Points</h2>

    <!-- Username -->
    <input id="adminUser" placeholder="Username">

    <!-- Add points -->
    <input id="addAmount" type="number" placeholder="Add points">
    <button onclick="addPoints()">Add Points</button>

    <!-- Remove points -->
    <input id="removeAmount" type="number" placeholder="Remove points">
    <button onclick="removePoints()">Remove Points</button>

    <h2>Redeem Reward</h2>

    <!-- Rewards dropdown -->
    <select id="rewardDropdown"></select>
    <button onclick="redeemReward()">Redeem</button>

     <h2>Remote Orders</h2>

<!-- Bases -->
<h3>Drink Bases</h3>
<input id="newBase" placeholder="New base">
<button onclick="addBase()">Add Base</button>

<select id="baseDropdown"></select>
<button onclick="removeBase()">Remove Base</button>

<!-- Flavors -->
<h3>Flavors (Optional)</h3>
<input id="newFlavor" placeholder="New flavor">
<button onclick="addFlavor()">Add Flavor</button>

<select id="flavorDropdown"></select>
<button onclick="removeFlavor()">Remove Flavor</button>

<!-- Orders -->
<h3>Incoming Orders</h3>
<div id="orderList"></div>


  </div>


  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>

  <!-- Your app logic -->
  <script src="app.js"></script>

</body>
</html>
